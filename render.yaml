# Render Blueprint Specification for Jira-Lite
# Deploy with 1-click on https://dashboard.render.com/blueprints

services:
  # Backend API + Socket.io Server (Web Service)
  - type: web
    name: jira-lite-server
    runtime: node
    plan: free
    region: oregon
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGO_URI
        sync: false # Enter your MongoDB Atlas connection URI in Render Dashboard
      - key: REDIS_URL
        sync: false # Optional: Upstash Redis connection URI
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CLIENT_URL
        fromService:
          type: static_site
          name: jira-lite-client
          property: host

  # Frontend Static Web App (Static Site)
  - type: static_site
    name: jira-lite-client
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: jira-lite-server
          property: host

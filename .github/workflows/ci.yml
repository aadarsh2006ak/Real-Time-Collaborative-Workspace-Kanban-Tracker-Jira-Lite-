name: CI/CD Pipeline - Jira-Lite

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  server-tests:
    name: Backend Test Suite & Lint
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Run Server Test Suite
        working-directory: ./server
        env:
          NODE_ENV: test
          PORT: 5000
          MONGO_URI: mongodb://localhost:27017/jira_lite_test
          REDIS_URL: redis://localhost:6379
          CLIENT_URL: http://localhost:5173
          JWT_ACCESS_SECRET: test_jwt_access_secret_ci_key_12345
          JWT_REFRESH_SECRET: test_jwt_refresh_secret_ci_key_12345
        run: npm test

  client-tests-and-build:
    name: Frontend Test Suite & Bundle Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Run Client Unit Tests
        working-directory: ./client
        run: npm test -- --run

      - name: Build Production SPA Bundle
        working-directory: ./client
        run: npm run build
